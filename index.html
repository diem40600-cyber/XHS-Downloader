<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XHS 图片去水印提取</title>
    <meta name="referrer" content="no-referrer">
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans">

    <div class="max-w-4xl mx-auto px-4 py-8">
        <header class="flex items-center justify-between mb-8 bg-gradient-to-r from-red-500 to-rose-600 p-4 rounded-xl shadow-md text-white">
            <div class="flex items-center space-x-2">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                <h1 class="text-xl font-bold tracking-wide">XHS 图片去水印提取</h1>
            </div>
            <span class="bg-white/20 text-xs px-2.5 py-1 rounded-full font-medium">纯前端安全版</span>
        </header>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 mb-8">
            <label class="block text-gray-700 text-sm font-semibold mb-3">请输入小红书分享链接：</label>
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="text" id="shareUrl" placeholder="支持手机端复制的完整分享口令或纯网页链接。" 
                       class="flex-1 px-4 py-3 border border-gray-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-red-400 focus:border-transparent transition-all text-sm">
                <button onclick="extractImages()" id="btnText"
                        class="bg-gradient-to-r from-red-500 to-rose-500 hover:from-red-600 hover:to-rose-600 text-white font-medium px-6 py-3 rounded-xl transition-all shadow-md hover:shadow-lg active:scale-95 whitespace-nowrap text-sm cursor-pointer">
                    立即提取原图
                </button>
            </div>
            <div id="loading" class="hidden mt-4 flex items-center justify-center space-x-2 text-gray-500 text-sm">
                <svg class="animate-spin h-5 w-5 text-red-500" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                <span>正在深度解析底层无水印资源，请稍候...</span>
            </div>
        </div>

        <div id="resultSection" class="hidden bg-white rounded-2xl shadow-sm border border-gray-100 p-6">
            <div class="border-b border-gray-100 pb-4 mb-6">
                <h2 id="noteTitle" class="text-lg font-bold text-gray-800 mb-1">作品标题</h2>
                <p id="authorName" class="text-sm text-gray-400">作者: </p>
            </div>
            <div id="imageGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-6">
                </div>
        </div>
    </div>

    <script>
        async function extractImages() {
            const shareUrl = document.getElementById('shareUrl').value.trim();
            if (!shareUrl) {
                alert('请先输入小红书分享链接！');
                return;
            }

            const loading = document.getElementById('loading');
            const resultSection = document.getElementById('resultSection');
            const imageGrid = document.getElementById('imageGrid');
            const btnText = document.getElementById('btnText');

            // 提取状态初始化
            loading.classList.remove('hidden');
            btnText.disabled = true;
            btnText.style.opacity = 0.6;
            imageGrid.innerHTML = '';

            try {
                // 🚀 精准指向你的专用编译后端
                const response = await fetch('https://xhs-download-thehan.onrender.com/xhs/detail', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    // ✨ 422 终极排雷：精简为后端最喜欢的纯净单参数格式
                    body: JSON.stringify({ url: shareUrl })
                });

                const resData = await response.json();

                if (response.ok && resData.data) {
                    const info = resData.data;

                    // 填入标题和作者
                    document.getElementById('noteTitle').innerText = info.作品标签 || '提取成功';
                    document.getElementById('authorName').innerText = `作者: ${info.作者昵称 || '未知'}`;

                    // 获取图片和视频数组（对接后端提供的数据字段）
                    const images = info.下载地址 || [];
                    const videos = info.动图地址 || [];

                    // 1. 判断是否为空
                    if (images.length === 0 && (!videos || videos.length === 0)) {
                        alert('未在这篇笔记中检测到图片或视频！');
                    } else {
                        // 2. 循环生成普通的静态图片卡片
                        if (Array.isArray(images)) {
                            images.forEach((imgUrl, index) => {
                                const proxyUrl = imgUrl;
                                const card = document.createElement('div');
                                card.className = "bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 group relative";
                                card.innerHTML = `
                                    <img src="${proxyUrl}" referrerpolicy="no-referrer" class="w-full h-64 object-cover" alt="原图">
                                    <div class="absolute inset-0 bg-black bg-opacity-40 opacity-0 group-hover:opacity-100 transition-opacity duration-200 flex items-center justify-center space-x-3">
                                        <a href="${proxyUrl}" target="_blank" rel="noreferrer" class="bg-white text-gray-800 px-4 py-2 rounded-lg text-sm font-medium hover:bg-gray-50 transition-colors shadow-sm">查看大图</a>
                                    </div>
                                    <div class="p-2 text-center border-t border-gray-50">
                                        <span class="text-xs text-gray-500 font-medium">第 ${index + 1} 张</span>
                                    </div>
                                `;
                                imageGrid.appendChild(card);
                            });
                        }

                        // 3. 🚀 2.0 升级：在图片下方平铺生成 Live 实况图和普通视频播放器
                        if (Array.isArray(videos)) {
                            videos.forEach((videoUrl, index) => {
                                if (videoUrl) {
                                    const card = document.createElement('div');
                                    card.className = "bg-white rounded-xl overflow-hidden shadow-sm border border-gray-100 group relative";
                                    card.innerHTML = `
                                        <video src="${videoUrl}" controls loop muted class="w-full h-64 object-cover" referrerpolicy="no-referrer"></video>
                                        <div class="absolute inset-x-0 bottom-0 bg-black bg-opacity-50 p-2 text-center">
                                            <a href="${videoUrl}" target="_blank" rel="noreferrer" class="inline-block bg-red-500 text-white px-3 py-1 rounded-md text-xs font-medium hover:bg-red-600 transition-colors shadow-sm">
                                                🎬 下载 Live 动图视频
                                            </a>
                                        </div>
                                    `;
                                    imageGrid.appendChild(card);
                                }
                            });
                        }
                    }

                    resultSection.classList.remove('hidden');
                } else {
                    alert('提取失败：' + (resData.message || '接口返回错误'));
                }
            } catch (error) {
                console.error(error);
                alert('网络连接失败，请检查 Render 后端是否正常响应！');
            } finally {
                loading.classList.add('hidden');
                btnText.disabled = false;
                btnText.style.opacity = 1;
            }
        }
    </script>
</body>
</html>
